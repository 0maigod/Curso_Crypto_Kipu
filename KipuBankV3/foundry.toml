[profile.default]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
src   = "src"
test  = "test"
out   = "out"
libs  = ["lib"]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
